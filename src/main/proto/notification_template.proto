syntax = "proto3";

package com.saas.notificationservice.proto;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.saas.notificationservice.proto";
option java_outer_classname = "NotificationTemplateProto";

service NotificationTemplateService {
  rpc CreateTemplate(CreateTemplateRequest) returns (TemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (TemplateResponse);
  rpc GetAllTemplates(GetAllTemplatesRequest) returns (TemplateListResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (TemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
}

message CreateTemplateRequest {
  string name = 1;
  string subject = 2;
  string body = 3;
  TemplateTypeProto type = 4;
}

message GetTemplateRequest {
  int64 id = 1;
}

message GetAllTemplatesRequest {
}

message UpdateTemplateRequest {
  int64 id = 1;
  string name = 2;
  string subject = 3;
  string body = 4;
  TemplateTypeProto type = 5;
}

message DeleteTemplateRequest {
  int64 id = 1;
}

message TemplateResponse {
  int64 id = 1;
  string name = 2;
  string subject = 3;
  string body = 4;
  TemplateTypeProto type = 5;
  string createdAt = 6;
  string updatedAt = 7;
}

message TemplateListResponse {
  repeated TemplateResponse templates = 1;
}

message DeleteTemplateResponse {
  bool success = 1;
  string message = 2;
}

